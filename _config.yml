# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: LOKI
subtitle: '记录生活的点点滴滴'
description: '你想拥有你从未拥有的东西，那就要去做你从未做过的事。'
keywords: CTF, 网络安全, blog, code
author: 王伟
language:
  - zh-CN
  - ja
timezone: 'Asia/Shanghai'

# URL
url: https://geeekerk.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlight:
  highlight.js:
    enable: false
  prismjs:
    enable: false
highlight:
  enable: true
  line_number: false
  auto_detect: true
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: false
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: wenfang

# SEO：OG 分享卡片
open_graph:
  twitter_card: summary
  image: /images/og-cover.png

# SEO：站点地图
sitemap:
  path: sitemap.xml

# SEO：RSS 订阅
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# Deployment
deploy:
  type: git
  repo: https://github.com/GeeekerK/GeeekerK.github.io.git
  branch: main
