name: Blog Sync & Deploy

# 触发方式：
#   - 主动触发（主路径，保证每天北京时间 0:00 准点）：
#     豆包定时任务「博客每日0点同步」每天 0:00 更新 .trigger-blog-sync 并 push，
#     由下面的 push 事件立即触发本 workflow。
#   - 定时兜底：schedule cron '0 16 * * *'（UTC 16:00 = 北京 0 点）。
#     注意 GitHub Actions 的 schedule 只负责排队，高峰期会延迟数小时，
#     因此它仅作为主动触发失败时的兜底，不作为准点保证。
#   - 手动触发：仓库 Actions 页面点 Run workflow。
# 说明：GitHub Actions 的 schedule 只认默认分支上的 workflow 文件，
#       因此本文件放在源码所在分支（main）。

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch: {}

# deploy-pages 要求的最小权限
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个实例，避免定时任务与手动触发重叠
concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync posts from Feishu
        id: sync
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
        run: |
          python3 tools/sync_from_feishu.py
          echo "CHANGED=$(git status --porcelain | wc -l)" >> "$GITHUB_ENV"

      - name: Commit synced posts
        if: env.CHANGED != '0' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "blog-sync[bot]"
          git config user.email "blog-sync[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: sync posts from Feishu $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || git pull --no-rebase origin main
            git push
          fi

      - name: Set up Node.js
        if: env.CHANGED != '0' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: env.CHANGED != '0' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build site (hexo generate)
        if: env.CHANGED != '0' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: npm run build

      - name: Configure Pages
        if: env.CHANGED != '0' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: env.CHANGED != '0' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: env.CHANGED != '0' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
